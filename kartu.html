<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kartu Nama Generator</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    padding:20px;
}

/* ===== FORM ===== */
.form-box{
    background:#ffffff;
    padding:15px;
    margin-bottom:20px;
    border:1px solid #ccc;
    width:400px;
}

.form-box input{
    width:100%;
    padding:6px;
    margin-bottom:8px;
}

button{
    padding:8px 12px;
    cursor:pointer;
}

/* ===== KARTU ===== */
.card{
    width:90mm;
    height:55mm;
    background:#ffffff;
    border:2px solid #000;
    padding:10px;
    box-sizing:border-box;
    display:flex;
    justify-content:space-between;
}

.left{
    width:60%;
}

.logo{
    font-size:18px;
    font-weight:bold;
}

.subtitle{
    font-size:11px;
    margin-bottom:6px;
}

.info{
    font-size:10px;
    margin-bottom:3px;
}

.qr{
    width:35%;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* PRINT */
@page{
    size:90mm 55mm;
    margin:0;
}

@media print{
    body *{
        visibility:hidden;
    }

    .card, .card *{
        visibility:visible;
    }

    .card{
        position:absolute;
        left:0;
        top:0;
    }
}
</style>
</head>

<body>

<h2>Generator Kartu Nama</h2>

<div class="form-box">
    <input type="text" id="namaToko" placeholder="Nama Toko" value="TOKO ZIZAN">
    <input type="text" id="subtitle" placeholder="Subtitle" value="Toko Online & Retail Modern">
    <input type="text" id="alamat" placeholder="Alamat" value="Jl. Contoh No.123, Taipei">
    <input type="text" id="hp" placeholder="Nomor HP" value="0912-345-678">
    <input type="text" id="email" placeholder="Email" value="tokozizan@email.com">
    <input type="text" id="qrLink" placeholder="Link QR (https://...)" value="https://tokozizan.com">

    <button onclick="updateCard()">Update Kartu</button>
    <button onclick="window.print()">Print</button>
</div>

<div class="card" id="cardArea">

    <div class="left">
        <div class="logo" id="previewNama">TOKO ZIZAN</div>
        <div class="subtitle" id="previewSub">Toko Online & Retail Modern</div>

        <div class="info" id="previewAlamat">📍 Jl. Contoh No.123, Taipei</div>
        <div class="info" id="previewHp">📞 0912-345-678</div>
        <div class="info" id="previewEmail">📧 tokozizan@email.com</div>
    </div>

    <div class="qr">
        <img id="previewQR"
        src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=https://tokozizan.com"
        width="90">
    </div>

</div>

<script>
function updateCard(){
    let nama = document.getElementById("namaToko").value;
    let sub = document.getElementById("subtitle").value;
    let alamat = document.getElementById("alamat").value;
    let hp = document.getElementById("hp").value;
    let email = document.getElementById("email").value;
    let qr = document.getElementById("qrLink").value;

    document.getElementById("previewNama").innerText = nama;
    document.getElementById("previewSub").innerText = sub;
    document.getElementById("previewAlamat").innerText = "📍 " + alamat;
    document.getElementById("previewHp").innerText = "📞 " + hp;
    document.getElementById("previewEmail").innerText = "📧 " + email;

    document.getElementById("previewQR").src =
    "https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=" + encodeURIComponent(qr);
}
</script>

</body>
</html>

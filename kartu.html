<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kartu Nama Putih Modern</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f0f0f0;
    padding:20px;
}

/* ===== FORM ===== */
.form-box{
    background:#ffffff;
    padding:15px;
    margin-bottom:20px;
    border-radius:8px;
    width:420px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.form-box input{
    width:100%;
    padding:8px;
    margin-bottom:10px;
}

button{
    padding:8px 14px;
    border:none;
    cursor:pointer;
    background:black;
    color:white;
}

/* ===== KARTU ===== */
.card{
    width:90mm;
    height:55mm;
    background:white;
    border:2px solid #000;
    padding:10px;
    box-sizing:border-box;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* LOGO */
.logo-img{
    width:50px;
    height:50px;
    object-fit:contain;
    margin-bottom:5px;
}

/* NAMA TOKO TENGAH */
.store-name{
    font-size:18px;
    font-weight:bold;
    text-align:center;
    margin-bottom:8px;
}

/* INFO DIGESER KE BAWAH */
.info-box{
    margin-top:auto;
    text-align:center;
    font-size:10px;
}

/* QR */
.qr{
    position:absolute;
    right:10px;
    bottom:10px;
}

.qr img{
    width:60px;
}

/* PRINT */
@page{
    size:90mm 55mm;
    margin:0;
}

@media print{
    body *{
        visibility:hidden;
    }

    .card, .card *{
        visibility:visible;
    }

    .card{
        position:absolute;
        left:0;
        top:0;
    }
}
</style>
</head>

<body>

<h2>Generator Kartu Nama Putih</h2>

<div class="form-box">
    <input type="text" id="namaToko" value="TOKO ZIZAN">
    <input type="text" id="alamat" value="Jl. Contoh No.123, Taipei">
    <input type="text" id="hp" value="0912-345-678">
    <input type="text" id="email" value="tokozizan@email.com">
    <input type="text" id="qrLink" value="https://tokozizan.com">
    
    <label>Upload Logo:</label>
    <input type="file" id="logoInput" accept="image/*">

    <button onclick="updateCard()">Update</button>
    <button onclick="window.print()">Print</button>
</div>

<div class="card">

    <img id="previewLogo" class="logo-img" src="" alt="">
    
    <div class="store-name" id="previewNama">
        TOKO ZIZAN
    </div>

    <div class="info-box">
        <div id="previewAlamat">Jl. Contoh No.123, Taipei</div>
        <div id="previewHp">0912-345-678</div>
        <div id="previewEmail">tokozizan@email.com</div>
    </div>

    <div class="qr">
        <img id="previewQR"
        src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=https://tokozizan.com">
    </div>

</div>

<script>

function updateCard(){
    document.getElementById("previewNama").innerText =
        document.getElementById("namaToko").value;

    document.getElementById("previewAlamat").innerText =
        document.getElementById("alamat").value;

    document.getElementById("previewHp").innerText =
        document.getElementById("hp").value;

    document.getElementById("previewEmail").innerText =
        document.getElementById("email").value;

    let qr = document.getElementById("qrLink").value;
    document.getElementById("previewQR").src =
        "https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=" 
        + encodeURIComponent(qr);
}

/* Upload Logo */
document.getElementById("logoInput").addEventListener("change", function(e){
    let reader = new FileReader();
    reader.onload = function(){
        document.getElementById("previewLogo").src = reader.result;
    }
    reader.readAsDataURL(e.target.files[0]);
});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Production Order</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body {
  font-family: Arial, "Microsoft JhengHei";
  margin: 10px;
  background: #f5f5f5;
}

/* HEADER */
.header {
  margin-bottom: 10px;
}

.header span {
  margin-right: 30px;
  font-weight: bold;
}

input.header-input {
  width: 150px;
  height: 22px;
}

/* EXCEL INPUT */
.excel-panel {
  position: fixed;
  top: 10px;
  right: 10px;
  background: #eee;
  border: 1px solid #333;
  padding: 8px;
  font-size: 12px;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
}

th, td {
  border: 1px solid #333;
  padding: 4px;
  text-align: center;
  font-size: 14px;
}

th {
  background: #eee;
}

td[contenteditable="true"] {
  background: #ffffe0;
}
</style>
</head>
<body>

<!-- EXCEL INPUT -->
<div class="excel-panel">
  <b>Excel 匯入資料</b><br>
  <input type="file" id="excelFile" accept=".xlsx,.xls">
</div>

<div class="header">
  <span>客戶訂單號：<font color="red">PI-250106-DK</font></span>
  <span>產線訂單號：<font color="blue">S2552104</font></span>
</div>

<div class="header">
  備料單號：<input class="header-input" id="materialNo">
  公司號：<input class="header-input" id="companyNo">
  BOM料號：<input class="header-input" id="bomNo">
</div>

<br>

<table id="orderTable">
<thead>
<tr>
  <th>項</th>
  <th>備料單號</th>
  <th>原始單號</th>
  <th>公司號</th>
  <th>正確號碼</th>
  <th>品名規格</th>
  <th>需求量</th>
  <th>接收總數</th>
  <th>實際出貨數</th>
  <th>完成數</th>
  <th>訂單備註</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
const tbody = document.querySelector("#orderTable tbody");

/* ===== EXCEL → DATABASE ===== */
document.getElementById("excelFile").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = evt => {
    const wb = XLSX.read(new Uint8Array(evt.target.result), { type: "array" });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });

    const payload = [];

    tbody.innerHTML = "";

    rows.slice(1).forEach((r, index) => {
      // tampil ke tabel
      const tr = document.createElement("tr");
      for (let i = 0; i < 11; i++) {
        const td = document.createElement("td");
        td.innerText = i === 0 ? index + 1 : (r[i-1] || "");
        if (i > 0) td.contentEditable = true;
        tr.appendChild(td);
      }
      tbody.appendChild(tr);

      // data ke database
      payload.push({
        material_no: r[0],
        origin_no: r[1],
        company_no: r[2],
        correct_no: r[3],
        product_name: r[4],
        qty_need: r[5],
        qty_receive: r[6],
        qty_ship: r[7],
        qty_finish: r[8],
        remark: r[9]
      });
    });

    sendToDatabase(payload);
  };
  reader.readAsArrayBuffer(file);
});

/* ===== SEND TO DATABASE ===== */
<script>
const SUPABASE_URL = "https://uusljhegkvahcjkaxqkz.supabase.co"; // GANTI
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1c2xqaGVna3ZhaGNqa2F4cWt6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ0ODMzMTIsImV4cCI6MjA3MDA1OTMxMn0.eio4OSjH30XzfXn-9UxQRVwleGKi2dvdWo6Ggx8FW1g";        // GANTI

function sendToDatabase(data) {
  fetch(`${SUPABASE_URL}/rest/v1/production_order`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Prefer": "return=minimal"
    },
    body: JSON.stringify(
      data.map(row => ({
        order_no: "PI-250106-DK",
        line_no: "S2552104",
        ...row
      }))
    )
  })
  .then(res => {
    if (!res.ok) throw new Error("Insert failed");
    alert("✅ Data Excel berhasil masuk Supabase");
  })
  .catch(err => {
    console.error(err);
    alert("❌ Gagal simpan ke Supabase");
  });
}
</script>


</body>
</html>

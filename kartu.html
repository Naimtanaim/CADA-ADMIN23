<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kartu Nama Modern</title>

<style>
body{
    font-family: 'Segoe UI', sans-serif;
    background:#eaeaea;
    padding:20px;
}

/* ===== FORM ===== */
.form-box{
    background:#ffffff;
    padding:15px;
    margin-bottom:20px;
    border-radius:8px;
    width:420px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.form-box input{
    width:100%;
    padding:8px;
    margin-bottom:10px;
    border-radius:6px;
    border:1px solid #ccc;
}

button{
    padding:8px 14px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.update-btn{
    background:#111;
    color:white;
}

.print-btn{
    background:#007bff;
    color:white;
}

/* ===== KARTU ===== */
.card{
    width:90mm;
    height:55mm;
    padding:12px;
    box-sizing:border-box;
    display:flex;
    justify-content:space-between;
    border-radius:12px;
    color:white;

    background: linear-gradient(135deg, #1c1c1c, #000000);
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.left{
    width:65%;
}

.logo{
    font-size:20px;
    font-weight:700;
    letter-spacing:1px;
}

.subtitle{
    font-size:11px;
    opacity:0.8;
    margin-bottom:8px;
}

.info{
    font-size:10px;
    margin-bottom:4px;
}

.qr{
    width:30%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.qr img{
    background:white;
    padding:4px;
    border-radius:8px;
}

/* PRINT */
@page{
    size:90mm 55mm;
    margin:0;
}

@media print{
    body *{
        visibility:hidden;
    }

    .card, .card *{
        visibility:visible;
    }

    .card{
        position:absolute;
        left:0;
        top:0;
        box-shadow:none;
    }
}
</style>
</head>

<body>

<h2>Generator Kartu Nama Modern</h2>

<div class="form-box">
    <input type="text" id="namaToko" value="TOKO ZIZAN">
    <input type="text" id="subtitle" value="Toko Online & Retail Modern">
    <input type="text" id="alamat" value="Jl. Contoh No.123, Taipei">
    <input type="text" id="hp" value="0912-345-678">
    <input type="text" id="email" value="tokozizan@email.com">
    <input type="text" id="qrLink" value="https://tokozizan.com">

    <button class="update-btn" onclick="updateCard()">Update</button>
    <button class="print-btn" onclick="window.print()">Print</button>
</div>

<div class="card">

    <div class="left">
        <div class="logo" id="previewNama">TOKO ZIZAN</div>
        <div class="subtitle" id="previewSub">Toko Online & Retail Modern</div>

        <div class="info" id="previewAlamat">📍 Jl. Contoh No.123, Taipei</div>
        <div class="info" id="previewHp">📞 0912-345-678</div>
        <div class="info" id="previewEmail">📧 tokozizan@email.com</div>
    </div>

    <div class="qr">
        <img id="previewQR"
        src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=https://tokozizan.com"
        width="85">
    </div>

</div>

<script>
function updateCard(){
    let nama = document.getElementById("namaToko").value;
    let sub = document.getElementById("subtitle").value;
    let alamat = document.getElementById("alamat").value;
    let hp = document.getElementById("hp").value;
    let email = document.getElementById("email").value;
    let qr = document.getElementById("qrLink").value;

    document.getElementById("previewNama").innerText = nama;
    document.getElementById("previewSub").innerText = sub;
    document.getElementById("previewAlamat").innerText = "📍 " + alamat;
    document.getElementById("previewHp").innerText = "📞 " + hp;
    document.getElementById("previewEmail").innerText = "📧 " + email;

    document.getElementById("previewQR").src =
    "https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=" + encodeURIComponent(qr);
}
</script>

</body>
</html>
